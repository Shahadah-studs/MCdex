<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/png" href="/faviconALT.png?v=1">   
    <title>MCdex</title>
    <!-- Favicon officiel de ton studio -->
    <link rel="icon" type="image/png" href="/favicon.png?v=final">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .studio-tag {
            color: #ffcc00;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }
        .generator-box {
            background-color: #1c1c1c;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #aaa;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            background-color: #111;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: monospace;
        }
        input[type="text"]:focus, select:focus {
            border-color: #ffcc00;
            outline: none;
        }
        button {
            background-color: #222;
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #ffcc00;
            color: #121212;
            transition: 0.2s ease-in-out;
        }
        /* Console responsive occupant 60% de la hauteur restante */
        iframe {
            width: 100%;
            height: 55vh;
            border: 1px solid #333;
            background-color: #111;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>SHAHADAH STUDIOS ELITE</h1>
        <h2>MCdex</h2>
        <div class="studio-tag">Vercel Engine V 0.1</div>
    </header>

    <div class="generator-box">
        <!-- Route locale ultra-rapide pointant vers ton dossier api -->
        <form action="/api/main" method="POST" target="console-output">
            
            <label for="block_name">BLOCK NAME:</label>
            <input type="text" id="block_name" name="block_name" placeholder="e.g., Matrix Core" required>

            <label for="block_type">BLOCK CATEGORY / TIER:</label>
            <select id="block_type" name="block_type">
                <option value="normal">Standard Block (Normal Tier)</option>
                <option value="light">Glowing Crystal (Light Tier)</option>
                <option value="god_tier">Unbreakable Matrix (God Tier)</option>
            </select>

            <button type="submit">[ INITIATE AI CODE GENERATION ]</button>
        </form>
    </div>

    <!-- Fenêtre d'affichage pour la console de ton Python -->
    <iframe name="console-output" src="about:blank"></iframe>

</body>
</html>
